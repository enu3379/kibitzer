<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  /* 팝업 히어로 (store-1-popup.png).

     팝업 안 해시계는 ?elapsedMin=30으로 낮 상태를 만든다 — 90분 예산의 1/3 지점이라
     sundial.ts가 해를 돔의 120° 지점(11시 방향)에 놓는다. 파라미터를 빼면 기본
     픽스처가 startedAt:0(예산 초과)이라 밤(달 + 별)으로 그려진다. insta1.html과 같은 값.

     이 장면은 scenes.css를 안 쓰고 자체 타입 스케일을 갖는다 — 브랜드 줄이 30px
     (2~5번은 21px)이라 점이 두 배 가까이 크게 찍힌다. */
  @font-face {
    font-family: "Gowun Dodum";
    src: url("assets/fonts/GowunDodum-Regular.woff2") format("woff2");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body {
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
    background:
      radial-gradient(900px 600px at 82% 40%, #ffffff 0%, rgba(255,255,255,0) 60%),
      linear-gradient(135deg, #f7f5ef 0%, #edeade 100%);
    color: #4a463e;
    display: flex; align-items: center;
  }
  .copy { width: 560px; padding-left: 96px; }
  .brand { font-size: 30px; letter-spacing: 0.5px; color: #6e6960; }
  .brand .leaf { color: #2b9e57; }
  h1 { font-size: 46px; line-height: 1.35; font-weight: 400; margin: 22px 0 26px; color: #3c3931; }
  h1 b { font-weight: 400; border-bottom: 3px solid #5aa63c66; }
  .sub { font-size: 20px; line-height: 1.7; color: #6e6960; }
  .badges { margin-top: 40px; display: flex; gap: 10px; flex-wrap: wrap; }
  .badge {
    font-size: 15px; color: #6e6960; background: #ffffffaa;
    border: 1px solid #e6e3dc; border-radius: 999px; padding: 7px 14px;
  }
  .stage { flex: 1; display: flex; justify-content: center; }
  .frame-card {
    transform: scale(1.55); transform-origin: center;
    border-radius: 14px; overflow: hidden; background: #fff;
    border: 1px solid #e6e3dc;
    box-shadow: 0 18px 50px -18px rgba(60, 57, 49, 0.35);
  }
  iframe { display: block; width: 296px; height: 356px; border: 0; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">Kibitzer<span class="leaf"> ●</span> 몰입 훈수꾼</div>
    <h1>목표를 선언하면<br>조용히 지켜보다,<br>딴짓이 쌓일 때만<br><b>슬쩍 훈수</b></h1>
    <div class="sub">차단하지 않습니다. 몰입 게이지가 닳는 걸<br>지켜보다가, 화면 구석에서 한마디 건넬 뿐.</div>
    <div class="badges">
      <span class="badge">비차단 훈수</span>
      <span class="badge">브라우징 기록 수집 없음</span>
    </div>
  </div>
  <div class="stage">
    <!-- elapsedMin=30 / 90분 예산 → frac 1/3 → sundial.ts가 해를 돔의 120° 지점(11시 방향)에
         놓는다. 파라미터를 빼면 startedAt:0이라 초과 상태의 밤(달)이 뜬다 — stub.js 참고. -->
    <div class="frame-card"><iframe src="popup/popup.html?elapsedMin=30"></iframe></div>
  </div>
</body>
</html>
