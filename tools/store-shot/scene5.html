<!doctype html>
<html lang="ko">
  <head>

      /* Nudged up so the bottom bleed cuts between rows, not through a hostname. */
      .stack .stage { margin-top: 14px; }
      .panel .clip { width: 940px; height: 622px; overflow: hidden; }
      .panel iframe { width: 940px; height: 640px; }
    </style>

    <div class="stack">
      <div class="copy">
        <div class="brand"><span>Kibitzer</span><span class="dot"></span><b>몰입 훈수꾼</b></div>
        <h1><span class="mark">기록은 내 브라우저 안에만</span> 남습니다.</h1>
        <p class="sub">
          클라우드 AI 사용은 선택입니다. 은행·의료·메일 같은 민감한 사이트는 애초에 관측하지 않습니다.
        </p>
      </div>
      <div class="stage">
        <div class="panel">
          <div class="clip"><iframe src="options/options.html?scene=sites#sites"></iframe></div>
        </div>
      </div>
    </div>
  </body>
</html>
