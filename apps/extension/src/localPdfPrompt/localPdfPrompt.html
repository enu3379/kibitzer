<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kibitzer</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #ffffff; --ink: #1f2937; --muted: #687381; --line: #d7dce2;
        --button: #ffffff; --primary: #202833; --primary-ink: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #25282e; --ink: #edf0f4; --muted: #b3b9c2; --line: #484d56;
          --button: #25282e; --primary: #e8ebef; --primary-ink: #1c2026;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-width: 0; background: var(--page); color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        line-height: 1.5;
      }
      main { padding: 22px 22px 18px; }
      .eyebrow { margin: 0 0 6px; color: var(--muted); font-size: 12px; }
      h1 { margin: 0 0 9px; font-size: 17px; font-weight: 600; line-height: 1.35; }
      .disclosure { margin: 0 0 19px; color: var(--muted); font-size: 12px; line-height: 1.65; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; }
      button {
        min-height: 35px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 7px;
        background: var(--button); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer;
      }
      button.primary { border-color: var(--primary); background: var(--primary); color: var(--primary-ink); }
      button:disabled { cursor: default; opacity: .62; }
      .status { min-height: 18px; margin: 13px 0 0; color: var(--muted); font-size: 12px; text-align: right; }
      .status.error { color: #b3443d; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="question"></h1>
      <p class="disclosure" id="disclosure"></p>
      <div class="actions">
        <button id="decline" type="button"></button>
        <button class="primary" id="enable" type="button"></button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="localPdfPrompt.js"></script>
  </body>
</html>
