  p.picked = p.picked.concat(EXTRA[p.key].picked);

const MAX = 46;
const STORE = "kibitzer-persona-copy-v1";
const load = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } };
let sel = load();
DATA.forEach(p => { if(!sel[p.key]) sel[p.key] = { hover:0, picked:0 }; });
const save = () => localStorage.setItem(STORE, JSON.stringify(sel));

let cur = 0;
const rail = document.getElementById("rail");
const panel = document.getElementById("panel");
const out = document.getElementById("out");
const prog = document.getElementById("prog");

function renderRail(){
  rail.innerHTML = "";
  DATA.forEach((p,i) => {
    const b = document.createElement("button");
    b.setAttribute("aria-current", String(i===cur));
    if (sel[p.key].touched) b.className = "done";
    b.innerHTML = '<span class="dot"></span>' + p.name;
    b.addEventListener("click", () => { cur = i; renderAll(); });
    rail.appendChild(b);
  });
}

function optionList(p, kind){
  const wrap = document.createElement("div");
  p[kind].forEach((line, i) => {
    if (i === p.refFrom) {
      const d = document.createElement("div");
      d.className = "divider";
      d.textContent = "레퍼런스 반영 2차";
      wrap.appendChild(d);
    }
    const b = document.createElement("button");
    b.className = "opt";
    b.setAttribute("role","radio");
    b.setAttribute("aria-checked", String(sel[p.key][kind] === i));
    const over = line.length > MAX;
    b.innerHTML =
      '<span class="txt">“' + line + '”</span>' +
      '<span class="meta">' +
        '<span class="len' + (over ? ' over' : '') + '">' + line.length + '자</span>' +
        (i === 0 ? '<span class="cur">현재</span>' : '') +
      '</span>';
    b.addEventListener("click", () => {
      sel[p.key][kind] = i;
      sel[p.key].touched = true;
      save(); renderAll();
    });
    wrap.appendChild(b);
  });
  return wrap;
}

function renderPanel(){
  const p = DATA[cur];
  panel.innerHTML = "";
  const h = document.createElement("div");
  h.innerHTML = '<h2>' + p.name + '</h2><p class="hint">' + p.note + '</p>';
  panel.appendChild(h);

  const l1 = document.createElement("div");
  l1.className = "seclabel";
  l1.innerHTML = '미리보기 <small>— 카드에 마우스를 올렸을 때. 이 말투가 뭔지 한 줄로 보여주는 대표 잔소리.</small>';
  panel.appendChild(l1);
  panel.appendChild(optionList(p, "hover"));

  const l2 = document.createElement("div");
  l2.className = "seclabel";
  l2.innerHTML = '선택 직후 <small>— 클릭해서 골랐을 때. 이 훈수꾼이 일을 맡는 인사.</small>';
  panel.appendChild(l2);
  panel.appendChild(optionList(p, "picked"));

  const pv = document.createElement("div");
  pv.className = "preview";
  pv.innerHTML =
    '<div class="pvlabel">실제 화면에서 이렇게 보입니다</div>' +
    '<div class="pquote prev" style="margin-bottom:8px">' +
      '<span class="tag">미리보기 · ' + p.name + '</span>' +
      '<span class="body">“' + p.hover[sel[p.key].hover] + '”</span>' +
    '</div>' +
    '<div class="pquote">' +
      '<span class="tag">선택됨 · ' + p.name + '</span>' +
      '<span class="body">“' + p.picked[sel[p.key].picked] + '”</span>' +
    '</div>';
  panel.appendChild(pv);

  const bar = document.createElement("div");
  bar.className = "bar";
  const prev = document.createElement("button");
  prev.className = "btn"; prev.textContent = "← 이전";
  prev.addEventListener("click", () => { cur = (cur - 1 + DATA.length) % DATA.length; renderAll(); });
  const next = document.createElement("button");
  next.className = "btn primary"; next.textContent = "다음 →";
  next.addEventListener("click", () => { cur = (cur + 1) % DATA.length; renderAll(); });
  bar.appendChild(prev); bar.appendChild(next);
  panel.appendChild(bar);
}

function renderOut(){
  const done = DATA.filter(p => sel[p.key].touched).length;
  prog.textContent = done + " / " + DATA.length + " 확인함";
  let s = "export const PERSONA_SAMPLE_LINES: Record<string, PersonaSampleLines> = {\n";
  DATA.forEach(p => {
    s += "  " + p.key + ": {\n";
    s += '    hover: "' + p.hover[sel[p.key].hover] + '",\n';
    s += '    picked: "' + p.picked[sel[p.key].picked] + '",\n';
    s += "  },\n";
  });
  s += "}\n";
  out.value = s;
}

function renderAll(){ renderRail(); renderPanel(); renderOut(); }

document.getElementById("copy").addEventListener("click", async e => {
  await navigator.clipboard.writeText(out.value);
  const b = e.target; const t = b.textContent;
  b.textContent = "복사됨"; setTimeout(() => b.textContent = t, 1200);
});
document.getElementById("reset").addEventListener("click", () => {
  sel = {}; DATA.forEach(p => sel[p.key] = { hover:0, picked:0 });
  save(); cur = 0; renderAll();
});

renderAll();
